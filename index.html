<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#120a24">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Cep Mikrofon 🎤</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#120a24;color:#f3eefe;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  body{display:flex;flex-direction:column;justify-content:center;gap:22px;
    padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom))}
  h1{margin:0;text-align:center;font-size:28px}
  #btn{width:100%;aspect-ratio:1;max-width:320px;margin:0 auto;border:0;border-radius:50%;
    font:inherit;font-size:24px;font-weight:700;color:#fff;background:#2b1d52;
    box-shadow:0 10px 40px rgba(0,0,0,.4)}
  #btn.on{background:linear-gradient(135deg,#ff3d9a,#b51cff);box-shadow:0 0 50px rgba(255,61,154,.6)}
  .meter{height:14px;border-radius:8px;background:#0b0618;overflow:hidden}
  .meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3dff8f,#ffd23f,#ff4d4d)}
  label{display:flex;justify-content:space-between;font-size:16px;margin-bottom:4px}
  label b{color:#29e0ff}
  input[type=range]{width:100%;accent-color:#ff3d9a;height:30px}
  select{width:100%;padding:12px;border-radius:12px;border:1px solid #3a2a66;background:#0f0820;color:#f3eefe;font:inherit;font-size:15px}
  p{margin:0;font-size:13px;color:#a99bcf;text-align:center;line-height:1.5}
  #err{color:#ff8fa8}
</style>
</head>
<body>
  <h1>🎤 Cep Mikrofon</h1>

  <button id="btn">Mikrofonu Aç</button>

  <div class="meter"><i id="meter"></i></div>

  <div>
    <label>🔊 Ses <b id="vVol">150%</b></label>
    <input type="range" id="vol" min="0" max="400" value="150">
  </div>

  <div>
    <label>🎧 Mikrofon</label>
    <select id="micSel"><option value="">Varsayılan</option></select>
  </div>

  <p>Önce telefonu Bluetooth hoparlöre bağla, sonra butona bas.<br>
  Ses az geliyorsa listeden <b>iPhone Mikrofonu</b>'nu seç.</p>
  <p id="err"></p>

<script>
(() => {
  const $ = id => document.getElementById(id);
  let ctx, gain, analyser, stream, src, wakeLock;

  function setup(){
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
    gain = ctx.createGain();
    analyser = ctx.createAnalyser(); analyser.fftSize = 512;
    gain.connect(ctx.destination);
    gain.connect(analyser);
    setVol();
    const d = new Uint8Array(analyser.fftSize);
    (function meter(){
      analyser.getByteTimeDomainData(d);
      let p = 0; for (const v of d) p = Math.max(p, Math.abs(v - 128));
      $('meter').style.width = Math.min(100, p / 128 * 140) + '%';
      requestAnimationFrame(meter);
    })();
  }

  async function start(){
    setup();
    if (ctx.state === 'suspended') await ctx.resume();
    try{
      const id = $('micSel').value;
      stream = await navigator.mediaDevices.getUserMedia({ audio: Object.assign(
        { echoCancellation: false, noiseSuppression: false, autoGainControl: true },
        id ? { deviceId: { exact: id } } : {}
      )});
    }catch(e){ $('err').textContent = 'Mikrofon izni verilmedi (' + e.name + ')'; return; }
    $('err').textContent = '';
    src = ctx.createMediaStreamSource(stream);
    src.connect(gain);
    $('btn').textContent = 'Açık — Kapat';
    $('btn').classList.add('on');
    listMics();
    try{ wakeLock = await navigator.wakeLock.request('screen'); }catch(e){}
  }

  function stop(){
    if (src){ src.disconnect(); src = null; }
    if (stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
    $('btn').textContent = 'Mikrofonu Aç';
    $('btn').classList.remove('on');
    if (wakeLock){ wakeLock.release().catch(()=>{}); wakeLock = null; }
  }

  async function listMics(){
    try{
      const sel = $('micSel'), cur = sel.value || stream?.getAudioTracks()[0].getSettings().deviceId || '';
      const mics = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'audioinput');
      sel.innerHTML = '<option value="">Varsayılan</option>' +
        mics.map((m, i) => `<option value="${m.deviceId}">${m.label || 'Mikrofon ' + (i + 1)}</option>`).join('');
      if ([...sel.options].some(o => o.value === cur)) sel.value = cur;
    }catch(e){}
  }

  function setVol(){
    const v = $('vol').value / 100;
    $('vVol').textContent = Math.round(v * 100) + '%';
    if (gain) gain.gain.value = v;
  }

  $('btn').onclick = () => stream ? stop() : start();
  $('vol').oninput = setVol;
  $('micSel').onchange = async () => { if (stream){ stop(); await start(); } };

  if (!navigator.mediaDevices?.getUserMedia) $('err').textContent = 'Sayfa https üzerinden açılmalı.';
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bereket Çiftliği</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd0f0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; color: #3b2a14;
    user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  #hud { position: fixed; top: calc(8px + env(safe-area-inset-top)); left: 8px; right: 8px;
    display: flex; gap: 8px; align-items: center; pointer-events: none; flex-wrap: wrap; }
  .chip { background: #fff7e2; border: 3px solid #a8742f; border-radius: 16px; padding: 5px 12px;
    font-weight: 800; font-size: 15px; box-shadow: 0 3px 0 #7a5220; pointer-events: auto; white-space: nowrap; }
  #lvl { display: flex; align-items: center; gap: 8px; }
  #xpbar { width: 80px; height: 10px; background: #e5d3a8; border-radius: 6px; overflow: hidden; }
  #xpfill { height: 100%; width: 0; background: #4fb3e8; }
  #btnInv { cursor: pointer; margin-left: auto; }

  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .lbl { position: absolute; transform: translate(-50%, -100%); background: rgba(255,247,226,.92);
    border: 2px solid #a8742f; border-radius: 10px; padding: 2px 8px; font-size: 12px; font-weight: 700;
    white-space: nowrap; }

  #joy { position: fixed; left: calc(18px + env(safe-area-inset-left)); bottom: calc(22px + env(safe-area-inset-bottom));
    width: 130px; height: 130px; border-radius: 50%; background: rgba(255,255,255,.28);
    border: 3px solid rgba(255,255,255,.6); touch-action: none; }
  #stick { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px;
    border-radius: 50%; background: rgba(255,255,255,.85); box-shadow: 0 2px 6px rgba(0,0,0,.25); }

  #act { position: fixed; right: calc(18px + env(safe-area-inset-right)); bottom: calc(34px + env(safe-area-inset-bottom));
    min-width: 120px; max-width: 60vw; padding: 16px 20px; font-size: 18px; font-weight: 900; color: #fff;
    background: #58b947; border: 4px solid #2f7d25; border-radius: 22px; box-shadow: 0 5px 0 #235e1b;
    display: none; cursor: pointer; font-family: inherit; }
  #act:active { transform: translateY(3px); box-shadow: 0 2px 0 #235e1b; }

  #toasts { position: fixed; top: calc(64px + env(safe-area-inset-top)); left: 0; right: 0; display: flex;
    flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
  .toast { background: #3b2a14; color: #fff7e2; padding: 8px 16px; border-radius: 14px; font-weight: 700;
    font-size: 14px; animation: pop .25s ease-out; max-width: 90vw; text-align: center; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } }

  #modal { position: fixed; inset: 0; background: rgba(40,25,5,.45); display: none;
    align-items: center; justify-content: center; padding: 14px; }
  #panel { background: #fff7e2; border: 5px solid #a8742f; border-radius: 22px; width: min(440px, 100%);
    max-height: 82vh; display: flex; flex-direction: column; box-shadow: 0 8px 0 #7a5220; }
  #panel header { display: flex; align-items: center; padding: 12px 16px; font-size: 20px; font-weight: 900;
    border-bottom: 3px solid #e5d3a8; }
  #panel header span { flex: 1; }
  #close { width: 38px; height: 38px; border-radius: 50%; border: 3px solid #a33; background: #e85b4f;
    color: #fff; font-size: 18px; font-weight: 900; cursor: pointer; }
  #rows { overflow-y: auto; padding: 10px 12px; touch-action: pan-y; }
  .row { display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-bottom: 2px dashed #e5d3a8; }
  .row:last-child { border-bottom: 0; }
  .row .ico { font-size: 28px; width: 38px; text-align: center; }
  .row .txt { flex: 1; min-width: 0; }
  .row .txt b { display: block; font-size: 15px; }
  .row .txt small { font-size: 12px; opacity: .8; }
  .btn { padding: 9px 13px; border-radius: 13px; border: 3px solid #2f7d25; background: #58b947; color: #fff;
    font-weight: 800; font-size: 14px; cursor: pointer; font-family: inherit; white-space: nowrap; }
  .btn.alt { background: #e9a13b; border-color: #a8742f; }
  .btn.red { background: #e85b4f; border-color: #a33; }
  .btn:disabled { background: #c9c2b0; border-color: #9a9483; cursor: default; }
  .note { padding: 6px 4px; font-size: 13px; opacity: .85; }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="hud">
  <div class="chip" id="lvl">⭐ <span id="lvlNo">1</span><div id="xpbar"><div id="xpfill"></div></div></div>
  <div class="chip">🪙 <span id="coins">0</span></div>
  <div class="chip" id="btnInv">📦 <span id="store">0/50</span></div>
</div>
<div id="toasts"></div>
<div id="joy"><div id="stick"></div></div>
<button id="act"></button>
<div id="modal"><div id="panel"><header><span id="ptitle"></span><button id="close">✕</button></header><div id="rows"></div></div></div>
<script type="module" src="./game.js"></script>
</body>
</html>
